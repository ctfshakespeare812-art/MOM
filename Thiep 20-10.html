<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thiệp chúc mừng 20/10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFEFF3;
    --ink: #3A1236;
    --muted: #7A4A6E;
    --paper: #FFFBFC;
    --rose: #E8527A;
    --rose2: #C73A63;
    --gold: #E9B44C;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Be Vietnam Pro", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    overflow-x: hidden;
  }

  /* Nút bấm mở thiệp ban đầu */
  #cover {
    background: var(--rose);
    color: white;
    border: none;
    padding: 16px 28px;
    font-size: 1.2rem;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(232, 82, 122, 0.35);
    display: flex;
    align-items: center;
    gap: 10px;
    transition: transform 0.2s, background 0.2s;
    z-index: 10;
    margin-bottom: 20px;
  }

  #cover:hover {
    background: var(--rose2);
    transform: scale(1.05);
  }

  #cover.hidden {
    display: none;
  }

  /* Khung thiệp chính */
  main#card {
    width: min(90vw, 400px);
    background: var(--paper);
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(120, 20, 60, 0.2);
    padding: 30px 24px;
    box-sizing: border-box;
    position: relative;
    transform: scale(0.95);
    opacity: 0;
    visibility: hidden;
    transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    outline: 2px dashed rgba(232, 82, 122, 0.3);
    outline-offset: -12px;
    z-index: 5;
  }

  main#card.show {
    transform: scale(1);
    opacity: 1;
    visibility: visible;
  }

  .date {
    font-family: "Dancing Script", cursive;
    font-size: 2.2rem;
    color: var(--rose);
    margin: 0 0 10px 0;
    text-align: center;
  }

  h1 {
    font-size: 1.4rem;
    text-align: center;
    color: var(--rose2);
    margin: 0 0 20px 0;
    font-weight: 600;
  }

  .to {
    font-weight: 600;
    font-size: 1.1rem;
    color: var(--ink);
    margin-bottom: 12px;
  }

  .msg {
    line-height: 1.7;
    color: var(--muted);
    font-size: 0.98rem;
    margin-bottom: 25px;
    white-space: pre-line;
  }

  .sig {
    text-align: right;
    font-style: italic;
    font-weight: 600;
    color: var(--rose2);
    margin: 0;
  }

  /* Nút bật tắt bảng chỉnh sửa */
  #toggle {
    margin-top: 25px;
    background: transparent;
    border: 1.5px solid var(--rose);
    color: var(--rose);
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 500;
    transition: all 0.2s;
  }

  #toggle:hover {
    background: var(--rose);
    color: white;
  }

  /* Bảng điều khiển / chỉnh sửa thiệp */
  #panel {
    width: min(90vw, 400px);
    background: white;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    box-sizing: border-box;
    margin-top: 15px;
    display: none;
    flex-direction: column;
    gap: 10px;
    z-index: 10;
  }

  #panel.open {
    display: flex;
  }

  #panel label {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
  }

  #panel input, #panel textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.95rem;
    box-sizing: border-box;
    outline: none;
    transition: border-color 0.2s;
  }

  #panel input:focus, #panel textarea:focus {
    border-color: var(--rose);
  }

  /* Hiệu ứng cánh hoa rơi */
  .petal {
    position: fixed;
    top: -20px;
    pointer-events: none;
    z-index: 99;
    animation: fall linear forwards;
    user-select: none;
  }

  @keyframes fall {
    0% {
      opacity: 1;
      transform: translateY(0) rotate(0deg) translateX(0);
    }
    100% {
      opacity: 0.3;
      transform: translateY(105vh) rotate(360deg) translateX(50px);
    }
  }
</style>
</head>
<body>

<!-- Nút mở thiệp ban đầu -->
<button id="cover" aria-label="Mở thiệp">
  <span>💌</span>
  <span>Chạm để mở thiệp</span>
</button>

<!-- Khung nội dung thiệp -->
<main id="card" aria-live="polite">
  <div class="inner" id="inner">
    <p class="date">20/10</p>
    <h1>Chúc mừng Ngày Phụ nữ Việt Nam</h1>
    <p class="to" id="outTo">Gửi Mẹ yêu,</p>
    <p class="msg" id="outMsg">Chúc mẹ ngày 20/10 thật vui vẻ, bình an và hạnh phúc nha. Một ngày may mắn nhaa💐</p>
    <p class="sig" id="outFrom">Con của mom á</p>
  </div>
</main>

<!-- Nút bật/tắt bảng chỉnh sửa nội dung -->
<button id="toggle">✏️ Chỉnh sửa lời chúc</button>

<!-- Bảng nhập liệu cá nhân hóa -->
<section id="panel" aria-label="Chỉnh thiệp">
  <label for="inTo">Gửi tới</label>
  <input id="inTo" value="Gửi Mẹ yêu,">
  
  <label for="inMsg">Lời chúc</label>
  <textarea id="inMsg" rows="4">Chúc mẹ ngày 20/10 thật vui vẻ, bình an và hạnh phúc nha. Một ngày may mắn nhaa💐</textarea>
  
  <label for="inFrom">Người gửi</label>
  <input id="inFrom" value="Con của mẹ">
</section>

<script>
  const coverBtn = document.getElementById('cover');
  const card = document.getElementById('card');
  const toggleBtn = document.getElementById('toggle');
  const panel = document.getElementById('panel');

  const inTo = document.getElementById('inTo');
  const inMsg = document.getElementById('inMsg');
  const inFrom = document.getElementById('inFrom');

  const outTo = document.getElementById('outTo');
  const outMsg = document.getElementById('outMsg');
  const outFrom = document.getElementById('outFrom');

  function updateCard() {
    outTo.textContent = inTo.value;
    outMsg.textContent = inMsg.value;
    outFrom.textContent = inFrom.value;
  }

  inTo.addEventListener('input', updateCard);
  inMsg.addEventListener('input', updateCard);
  inFrom.addEventListener('input', updateCard);

  function createPetals() {
    const symbol = '🌸';
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.className = 'petal';
      p.textContent = symbol;
      p.style.left = Math.random() * 100 + 'vw';
      p.style.fontSize = (Math.random() * 10 + 14) + 'px';
      p.style.animationDuration = (Math.random() * 3 + 3) + 's';
      p.style.animationDelay = (Math.random() * 2) + 's';
      document.body.appendChild(p);

      p.addEventListener('animationend', () => {
        p.remove();
      });
    }
  }

  coverBtn.addEventListener('click', () => {
    coverBtn.classList.add('hidden');
    card.classList.add('show');
    createPetals();
  });

  toggleBtn.addEventListener('click', () => {
    panel.classList.toggle('open');
    toggleBtn.textContent = panel.classList.contains('open') ? '❌ Đóng bảng chỉnh' : '✏️ Chỉnh sửa lời chúc';
  });
</script>

</body>
</html>
